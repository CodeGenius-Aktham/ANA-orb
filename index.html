<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente IA - Orbe Verde Líquido</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldGlow: '#10b981',
                        emeraldDark: '#059669',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Outfit', sans-serif;
        }
        /* Liquid Glass effect customized for clean white theme with green tones */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.25);
            box-shadow: 0 8px 32px 0 rgba(16, 185, 129, 0.08);
        }
        #voiceBtn.recording {
            background-color: #ef4444 !important;
            color: white !important;
            animation: pulseRec 1.2s infinite;
        }
        @keyframes pulseRec {
            0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70%  { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Transición suave del orbe entre tamaño grande (bienvenida) y chico (chat) */
        #orbWrap {
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .orb-size-hero {
            width: 18rem;
            height: 18rem;
        }
        @media (min-width: 640px) {
            .orb-size-hero { width: 24rem; height: 24rem; }
        }
        .orb-size-mini {
            width: 4.5rem;
            height: 4.5rem;
        }

        #topArea {
            transition: padding 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Burbujas de chat */
        .bubble-user {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border-radius: 1.1rem 1.1rem 0.25rem 1.1rem;
        }
        .bubble-ia {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #1e293b;
            border-radius: 1.1rem 1.1rem 1.1rem 0.25rem;
        }

        /* Puntos de "escribiendo..." */
        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-right: 3px;
            border-radius: 50%;
            background-color: #10b981;
            animation: typingBounce 1.2s infinite ease-in-out;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        #chatMessages::-webkit-scrollbar,
        #sidebarList::-webkit-scrollbar {
            width: 6px;
        }
        #chatMessages::-webkit-scrollbar-thumb,
        #sidebarList::-webkit-scrollbar-thumb {
            background-color: rgba(16, 185, 129, 0.25);
            border-radius: 999px;
        }
    </style>
</head>
<body class="bg-white text-slate-800 h-screen flex flex-col overflow-hidden selection:bg-emerald-500 selection:text-white">

    <p style="color: #16a34a; font-size: 0.8rem; text-align: center; padding: 0.5rem 0 0 0;">
        Esta version es una DEMO, por lo cual algunas funciones pueden no estar disponibles y otras pueden cometer errores.
    </p>

    <!-- Header vacío y limpio sin datos adicionales -->
    <header class="w-full px-6 pt-4 pb-1 flex justify-between items-center z-10 flex-shrink-0">
        <div></div>
        <div></div>
    </header>

    <!-- ZONA SUPERIOR: orbe + estado. Empieza grande y centrada (bienvenida), luego se hace chica y sube -->
    <div id="topArea" class="flex-shrink-0 flex flex-col items-center justify-center px-4 py-10 gap-4">

        <!-- Contenedor del Orbe -->
        <div id="orbWrap" class="orb-size-hero relative flex items-center justify-center">
            <!-- Resplandor ambiental verde dinámico -->
            <div id="ambientGlow" class="absolute inset-0 rounded-full bg-emerald-400/20 blur-3xl transition-all duration-700 pointer-events-none scale-90"></div>
            <!-- Lienzo para la animación fluida tipo plastilina/líquido -->
            <canvas id="orbCanvas" class="w-full h-full cursor-pointer z-10"></canvas>
        </div>

        <!-- Proceso actual / Pensamiento -->
        <div class="h-6 flex items-center justify-center">
            <div id="thoughtProcess" class="text-xs sm:text-sm text-emerald-600 font-medium tracking-wide flex items-center space-x-2 transition-all duration-300 opacity-0">
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="thoughtText">Procesando respuesta...</span>
            </div>
        </div>

        <!-- Mensaje de bienvenida, solo visible antes del primer mensaje -->
        <div id="welcomeText" class="max-w-2xl w-full text-center px-4">
            <p class="text-2xl sm:text-3xl font-light text-slate-700">Bienvenido nuevamente</p>
            <p class="text-sm sm:text-base text-slate-400 mt-2">Escribe tu consulta o habla directamente para comenzar.</p>
        </div>
    </div>

    <!-- ZONA DE CHAT: conversación al centro + historial de mensajes a la derecha. Oculta hasta el primer mensaje -->
    <div id="chatArea" class="hidden flex-1 min-h-0 w-full">
        <div class="flex h-full w-full max-w-6xl mx-auto">
            <!-- Conversación en el centro -->
            <div id="chatMessages" class="flex-1 min-w-0 overflow-y-auto px-4 sm:px-8 py-6 space-y-4"></div>

            <!-- Historial de mensajes a la derecha -->
            <aside class="hidden md:flex md:w-72 flex-shrink-0 flex-col border-l border-emerald-100 px-4 py-6">
                <h2 class="text-xs font-semibold uppercase tracking-wide text-emerald-600 mb-3">Mensajes</h2>
                <div id="sidebarList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            </aside>
        </div>
    </div>

    <!-- Controls & Prompt Input Footer con Liquid Glass Verde y botones ordenados -->
    <footer class="w-full p-6 z-10 flex flex-col items-center flex-shrink-0">
        <div class="max-w-3xl w-full flex items-center gap-3 liquid-glass rounded-2xl p-2.5 transition-all focus-within:ring-2 focus-within:ring-emerald-500/30">
            <input type="text" id="userInput" placeholder="Escribe un mensaje..." 
                class="flex-1 bg-transparent border-none px-4 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none">
            
            <!-- Botón de Envío -->
            <button id="sendBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium p-3 rounded-xl text-sm transition-all shadow-md shadow-emerald-500/20 active:scale-95 flex items-center justify-center" title="Enviar">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>

            <!-- Botón de Voz / Micrófono a la derecha -->
            <button id="voiceBtn" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-medium p-3 rounded-xl text-sm transition-all active:scale-95 flex items-center justify-center" title="Hablar directamente">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path></svg>
            </button>
        </div>
    </footer>

    <!-- Script de animación del orbe verde puro y conexión con el backend Flask -->
    <script>
        // Elementos UI
        const canvas = document.getElementById('orbCanvas');
        const ctx = canvas.getContext('2d');
        const thoughtProcess = document.getElementById('thoughtProcess');
        const thoughtText = document.getElementById('thoughtText');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const ambientGlow = document.getElementById('ambientGlow');

        const topArea = document.getElementById('topArea');
        const orbWrap = document.getElementById('orbWrap');
        const welcomeText = document.getElementById('welcomeText');
        const chatArea = document.getElementById('chatArea');
        const chatMessages = document.getElementById('chatMessages');
        const sidebarList = document.getElementById('sidebarList');

        // Configuración de Canvas Retina Display
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Estados del Orbe (siempre tonos verdes)
        let orbState = 'idle'; // idle, thinking, speaking
        let time = 0;
        let audioLevel = 0; 

        // Puntos de control para la plastilina/fluido verde orgánico
        const numPoints = 16;
        let points = [];
        for (let i = 0; i < numPoints; i++) {
            points.push({
                angle: (i / numPoints) * Math.PI * 2,
                offset: 0,
                velocity: Math.random() * 0.04 + 0.015
            });
        }

        // Bucle de renderizado del Orbe Verde
        function animateOrb() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const rect = canvas.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            let baseRadius = Math.min(centerX, centerY) * 0.52;

            time += 0.025;

            let currentDeform = 10;
            let speedMultiplier = 1;

            if (orbState === 'idle') {
                currentDeform = 9;
                speedMultiplier = 0.9;
                ambientGlow.style.background = 'rgba(16, 185, 129, 0.18)';
            } else if (orbState === 'thinking') {
                currentDeform = 16;
                speedMultiplier = 2.2;
                ambientGlow.style.background = 'rgba(5, 150, 105, 0.25)';
            } else if (orbState === 'speaking') {
                currentDeform = 26 + (audioLevel * 22);
                speedMultiplier = 3.2;
                ambientGlow.style.background = 'rgba(52, 211, 153, 0.35)';
            }

            // Gradiente verde elegante para fondo blanco
            const gradient = ctx.createRadialGradient(centerX - 35, centerY - 35, 10, centerX, centerY, baseRadius * 1.35);
            gradient.addColorStop(0, '#34d399');    // Verde esmeralda claro brillante
            gradient.addColorStop(0.6, '#059669');  // Verde esmeralda intenso
            gradient.addColorStop(1, '#065f46');    // Sombra verde profunda

            ctx.save();
            ctx.beginPath();

            let coords = [];
            for (let i = 0; i < numPoints; i++) {
                let p = points[i];
                let noise = Math.sin(time * speedMultiplier + i * 1.2) * currentDeform;
                if (orbState === 'speaking') {
                    noise += (Math.random() - 0.5) * 14 * audioLevel;
                }
                let r = baseRadius + noise;
                let x = centerX + Math.cos(p.angle) * r;
                let y = centerY + Math.sin(p.angle) * r;
                coords.push({x, y});
            }

            ctx.moveTo((coords[0].x + coords[numPoints - 1].x) / 2, (coords[0].y + coords[numPoints - 1].y) / 2);
            for (let i = 0; i < numPoints; i++) {
                let curr = coords[i];
                let next = coords[(i + 1) % numPoints];
                let mx = (curr.x + next.x) / 2;
                let my = (curr.y + next.y) / 2;
                ctx.quadraticCurveTo(curr.x, curr.y, mx, my);
            }

            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.shadowColor = 'rgba(16, 185, 129, 0.4)';
            ctx.shadowBlur = 35;
            ctx.fill();
            ctx.restore();

            requestAnimationFrame(animateOrb);
        }
        animateOrb();

        // ==========================================
        // MODO CHAT: pasa de pantalla de bienvenida (orbe grande centrado)
        // a orbe chico arriba + conversación en el centro + historial a la derecha.
        // ==========================================
        let chatStarted = false;

        function iniciarModoChat() {
            if (chatStarted) return;
            chatStarted = true;

            orbWrap.classList.remove('orb-size-hero');
            orbWrap.classList.add('orb-size-mini');
            topArea.classList.add('py-3');
            topArea.classList.remove('py-10');
            welcomeText.classList.add('hidden');

            chatArea.classList.remove('hidden');
            chatArea.classList.add('flex');

            resizeCanvas();
        }

        function scrollChatAbajo() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Crea una burbuja de usuario (a la derecha) con el texto ya completo
        function agregarMensajeUsuario(texto) {
            iniciarModoChat();

            const row = document.createElement('div');
            row.className = 'flex justify-end';
            const bubble = document.createElement('div');
            bubble.className = 'bubble-user max-w-[75%] px-4 py-2.5 text-sm sm:text-base shadow-sm';
            bubble.innerText = texto;
            row.appendChild(bubble);
            chatMessages.appendChild(row);
            scrollChatAbajo();

            agregarAlHistorial('Tú', texto);
        }

        // Crea una burbuja de IA con puntos de "escribiendo..." y devuelve el nodo de texto para rellenarlo luego
        function agregarBurbujaIAPendiente() {
            const row = document.createElement('div');
            row.className = 'flex justify-start';
            const bubble = document.createElement('div');
            bubble.className = 'bubble-ia max-w-[75%] px-4 py-2.5 text-sm sm:text-base shadow-sm whitespace-pre-wrap';
            bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
            row.appendChild(bubble);
            chatMessages.appendChild(row);
            scrollChatAbajo();
            return bubble;
        }

        // Efecto de escritura letra por letra dentro de una burbuja del chat
        function escribirEnBurbuja(bubbleEl, texto) {
            return new Promise((resolve) => {
                bubbleEl.innerText = '';
                let i = 0;
                const velocidad = 20;

                function escribir() {
                    if (i < texto.length) {
                        bubbleEl.innerText += texto.charAt(i);
                        audioLevel = Math.sin(i * 0.4) * 0.5 + 0.5;
                        i++;
                        scrollChatAbajo();
                        setTimeout(escribir, velocidad);
                    } else {
                        audioLevel = 0;
                        resolve();
                    }
                }
                escribir();
            });
        }

        function agregarAlHistorial(rol, texto) {
            const item = document.createElement('div');
            item.className = 'text-xs bg-emerald-50/60 rounded-lg px-3 py-2 border border-emerald-100';
            const truncado = texto.length > 60 ? texto.slice(0, 60) + '…' : texto;
            item.innerHTML = `<span class="font-semibold text-emerald-700">${rol}:</span> <span class="text-slate-600">${truncado}</span>`;
            sidebarList.appendChild(item);
            sidebarList.scrollTop = sidebarList.scrollHeight;
        }

        // ==========================================
        // ZONA DE CONEXIÓN CON EL BACKEND FLASK (blueprint 'input')
        //   POST /query/into      -> ingreso de audio, devuelve el texto transcrito
        //   POST /query/response  -> recibe { texto } y devuelve la respuesta del modelo
        //   POST /query/generate  -> recibe { texto } y devuelve la voz (texto a voz)
        // ==========================================
        // NOTA: si cambia la URL de ngrok, solo hay que actualizar esta constante.
        const API_BASE = 'https://dc76-190-24-70-29.ngrok-free.app/query';

        // Header requerido por ngrok free para evitar la página de advertencia del navegador
        const NGROK_HEADERS = { 'ngrok-skip-browser-warning': 'true' };

        // 2. Texto del usuario -> respuesta del modelo -> voz de salida
        async function conectarConMiModelo(promptTexto) {
            setOrbState('thinking');
            mostrarProceso(true, "Procesando solicitud...");

            const bubbleIA = agregarBurbujaIAPendiente();

            try {
                const resResponse = await fetch(`${API_BASE}/response`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...NGROK_HEADERS
                    },
                    body: JSON.stringify({ texto: promptTexto })
                });

                if (!resResponse.ok) {
                    throw new Error(`Error en /response: ${resResponse.status}`);
                }

                const dataResponse = await resResponse.json();
                // NOTA: ajusta esta clave según lo que realmente devuelva response_modelo()
                const respuestaIA = dataResponse.output ?? dataResponse.respuesta ?? dataResponse.texto ?? JSON.stringify(dataResponse);

                mostrarProceso(false);
                setOrbState('speaking');

                // Texto en la burbuja y generación de voz en paralelo
                await Promise.all([
                    escribirEnBurbuja(bubbleIA, respuestaIA),
                    generarVoz(respuestaIA)
                ]);

                agregarAlHistorial('IA', respuestaIA);

            } catch (error) {
                console.error("Error al conectar con el modelo:", error);
                mostrarProceso(false);
                bubbleIA.innerText = "Error de conexión con el modelo.";
            } finally {
                setOrbState('idle');
            }
        }

        // 3. Texto a voz vía /generate
        async function generarVoz(texto) {
            try {
                const resVoz = await fetch(`${API_BASE}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...NGROK_HEADERS
                    },
                    body: JSON.stringify({ texto: texto })
                });

                if (!resVoz.ok) {
                    throw new Error(`Error en /generate (voz): ${resVoz.status}`);
                }

                const contentType = resVoz.headers.get('Content-Type') || '';

                if (contentType.startsWith('audio/')) {
                    // generate_model() devuelve el audio directamente como binario
                    const audioBlob = await resVoz.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    await audio.play();
                } else {
                    // generate_model() devuelve JSON con audio_url o audio en base64
                    // NOTA: ajusta estas claves según lo que realmente devuelva tu backend
                    const dataVoz = await resVoz.json();
                    const audioSrc = dataVoz.audio_url
                        ?? (dataVoz.audio_base64 ? `data:audio/mpeg;base64,${dataVoz.audio_base64}` : null);
                    if (audioSrc) {
                        const audio = new Audio(audioSrc);
                        await audio.play();
                    }
                }
            } catch (error) {
                console.error("Error al generar voz en /generate:", error);
            }
        }

        function setOrbState(state) {
            orbState = state;
        }

        function mostrarProceso(mostrar, texto = "Procesando...") {
            if (mostrar) {
                thoughtText.innerText = texto;
                thoughtProcess.classList.remove('opacity-0');
            } else {
                thoughtProcess.classList.add('opacity-0');
            }
        }

        // Eventos de interacción (texto escrito)
        sendBtn.addEventListener('click', () => {
            const texto = userInput.value.trim();
            if (texto) {
                userInput.value = "";
                agregarMensajeUsuario(texto);
                conectarConMiModelo(texto);
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        // ==========================================
        // 1. CAPTURA DE AUDIO -> /into (ingreso de info)
        // Se graba con MediaRecorder, se sube el blob a /into,
        // y el texto transcrito que devuelve se manda a conectarConMiModelo().
        // ==========================================
        let mediaRecorder = null;
        let mediaStream = null;
        let audioChunks = [];
        let isRecording = false;

        async function iniciarGrabacion() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(mediaStream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    mediaStream.getTracks().forEach(track => track.stop());
                    voiceBtn.classList.remove('recording');
                    setOrbState('thinking');
                    mostrarProceso(true, "Transcribiendo audio...");

                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    // NOTA: ajusta el nombre del campo ('audio') según lo que espere captura_audio()
                    formData.append('audio', audioBlob, 'grabacion.webm');

                    try {
                        const resInto = await fetch(`${API_BASE}/into`, {
                            method: 'POST',
                            headers: { ...NGROK_HEADERS },
                            body: formData
                        });

                        if (!resInto.ok) {
                            throw new Error(`Error en /into: ${resInto.status}`);
                        }

                        const dataInto = await resInto.json();
                        // NOTA: ajusta esta clave según lo que realmente devuelva captura_audio()
                        const textoTranscrito = dataInto.texto ?? dataInto.transcripcion ?? dataInto.output ?? "";

                        mostrarProceso(false);

                        if (textoTranscrito) {
                            agregarMensajeUsuario(textoTranscrito);
                            await conectarConMiModelo(textoTranscrito);
                        } else {
                            setOrbState('idle');
                            mostrarProceso(true, "No se pudo transcribir el audio.");
                            setTimeout(() => mostrarProceso(false), 2500);
                        }
                    } catch (error) {
                        console.error("Error al enviar audio a /into:", error);
                        mostrarProceso(false);
                        setOrbState('idle');
                    }
                };

                mediaRecorder.start();
                isRecording = true;
                voiceBtn.classList.add('recording');
                mostrarProceso(true, "Escuchando... presiona de nuevo para detener.");
            } catch (err) {
                console.error("No se pudo acceder al micrófono:", err);
                mostrarProceso(true, "Permiso de micrófono denegado o no disponible.");
                setTimeout(() => mostrarProceso(false), 3000);
            }
        }

        function detenerGrabacion() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
            }
        }

        if (navigator.mediaDevices && window.MediaRecorder) {
            voiceBtn.addEventListener('click', () => {
                if (isRecording) {
                    detenerGrabacion();
                } else {
                    iniciarGrabacion();
                }
            });
        } else {
            voiceBtn.addEventListener('click', () => {
                mostrarProceso(true, "Tu navegador no soporta grabación de audio.");
                setTimeout(() => mostrarProceso(false), 3000);
            });
        }
    </script>
</body>
</html>
