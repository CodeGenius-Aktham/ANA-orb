<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente IA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Página vacía: no hay elementos visibles. La conexión con el backend queda abajo, lista para usarse. -->

    <script>
        // ==========================================
        // ZONA DE CONEXIÓN CON EL BACKEND FLASK (blueprint 'input')
        //   POST /query/into      -> ingreso de audio, devuelve el texto transcrito
        //   POST /query/response  -> recibe { texto } y devuelve la respuesta del modelo
        //   POST /query/generate  -> recibe { texto } y devuelve la voz (texto a voz)
        //   GET  /query/send_image/images/<nombre_imagen> -> send_to_image(): devuelve el archivo
        //                            de la carpeta 'images_inventory' con ese nombre (o JSON {Error} con 400)
        // ==========================================
        // NOTA: si cambia la URL de ngrok, solo hay que actualizar esta constante.
        const API_BASE = 'https://f333-186-29-72-11.ngrok-free.app/query';

        // Header requerido por ngrok free para evitar la página de advertencia del navegador
        const NGROK_HEADERS = { 'ngrok-skip-browser-warning': 'true' };

        const IMAGE_ENDPOINT = `${API_BASE}/send_image/images`;

        // Texto del usuario -> respuesta del modelo.
        // Devuelve { texto, imagenes } donde imagenes es la lista de nombres de archivo que el modelo pidió mostrar.
        async function consultarModelo(promptTexto) {
            const resResponse = await fetch(`${API_BASE}/response`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...NGROK_HEADERS
                },
                body: JSON.stringify({ texto: promptTexto })
            });

            if (!resResponse.ok) {
                throw new Error(`Error en /response: ${resResponse.status}`);
            }

            const dataResponse = await resResponse.json();
            // NOTA: ajusta esta clave según lo que realmente devuelva response_modelo()
            const texto = dataResponse.output ?? dataResponse.respuesta ?? dataResponse.texto ?? JSON.stringify(dataResponse);
            // response_modelo() indica en 'image_url' las fotos del inventario a mostrar (opcional):
            // un nombre ("a.png"), varios separados por coma ("a.png, b.png") o una lista ["a.png", "b.png"]
            const imagenes = normalizarListaImagenes(dataResponse.image_url ?? dataResponse.image_urls);

            return { texto, imagenes };
        }

        // Texto a voz vía /generate. Reproduce el audio que devuelve el backend.
        async function generarVoz(texto) {
            const resVoz = await fetch(`${API_BASE}/generate`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...NGROK_HEADERS
                },
                body: JSON.stringify({ texto: texto })
            });

            if (!resVoz.ok) {
                throw new Error(`Error en /generate (voz): ${resVoz.status}`);
            }

            const contentType = resVoz.headers.get('Content-Type') || '';

            if (contentType.startsWith('audio/')) {
                // generate_model() devuelve el audio directamente como binario
                const audioBlob = await resVoz.blob();
                const audio = new Audio(URL.createObjectURL(audioBlob));
                await audio.play();
            } else {
                // generate_model() devuelve JSON con audio_url o audio en base64
                // NOTA: ajusta estas claves según lo que realmente devuelva tu backend
                const dataVoz = await resVoz.json();
                const audioSrc = dataVoz.audio_url
                    ?? (dataVoz.audio_base64 ? `data:audio/mpeg;base64,${dataVoz.audio_base64}` : null);
                if (audioSrc) {
                    const audio = new Audio(audioSrc);
                    await audio.play();
                }
            }
        }

        // Acepta string ("a.png" o "a.png, b.png") o array (["a.png", "b.png"]) y devuelve una lista limpia
        function normalizarListaImagenes(valor) {
            if (!valor) return [];
            const lista = Array.isArray(valor) ? valor : String(valor).split(',');
            return lista.map((v) => String(v).trim()).filter(Boolean);
        }

        // Descarga una imagen del inventario y devuelve { url, nombre } con una URL de objeto lista para usar
        async function descargarImagenInventario(nombreImagen) {
            const resImagen = await fetch(`${IMAGE_ENDPOINT}/${encodeURIComponent(nombreImagen)}`, {
                method: 'GET',
                headers: { ...NGROK_HEADERS }
            });

            const contentType = resImagen.headers.get('Content-Type') || '';

            if (!resImagen.ok || !contentType.startsWith('image/')) {
                // send_to_image() devuelve JSON {'Error': '...'} con status 400 si falla
                let detalle = `status ${resImagen.status}`;
                try {
                    const dataError = await resImagen.json();
                    detalle = dataError.Error ?? dataError.error ?? detalle;
                } catch (_) { /* cuerpo no JSON */ }
                throw new Error(`Error en /send_image/images/${nombreImagen}: ${detalle}`);
            }

            const blob = await resImagen.blob();
            return { url: URL.createObjectURL(blob), nombre: nombreImagen };
        }

        // Audio grabado -> /into -> texto transcrito
        async function transcribirAudio(audioBlob) {
            const formData = new FormData();
            // NOTA: ajusta el nombre del campo ('audio') según lo que espere captura_audio()
            formData.append('audio', audioBlob, 'grabacion.webm');

            const resInto = await fetch(`${API_BASE}/into`, {
                method: 'POST',
                headers: { ...NGROK_HEADERS },
                body: formData
            });

            if (!resInto.ok) {
                throw new Error(`Error en /into: ${resInto.status}`);
            }

            const dataInto = await resInto.json();
            // NOTA: ajusta esta clave según lo que realmente devuelva captura_audio()
            return dataInto.texto ?? dataInto.transcripcion ?? dataInto.output ?? "";
        }
    </script>
</body>
</html>
